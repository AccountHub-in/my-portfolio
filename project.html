<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Projects</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        :root {
            --background-color: #1a1a1a;
            --card-background: #252525;
            --text-color: #f0f0f0;
            --red-accent: #e53935;
            --border-color: #333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--red-accent);
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2.5rem;
            letter-spacing: 2px;
        }

        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
            width: 100%;
            max-width: 1200px;
        }

        .project-card {
            background-color: var(--card-background);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
        }

        .project-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
        }

        .project-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .project-info {
            padding: 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .project-info h3 {
            margin-top: 0;
            color: var(--red-accent);
            font-size: 1.5rem;
            letter-spacing: 1px;
        }

        .project-info p {
            margin-bottom: 1.5rem;
            line-height: 1.6;
            color: #ccc;
        }

        .project-link {
            color: var(--red-accent);
            text-decoration: none;
            font-size: 1.2rem;
            align-self: flex-start;
            transition: color 0.3s ease;
        }

        .project-link:hover {
            color: #ff6b6b;
        }

        .add-project-btn {
            background-color: var(--red-accent);
            color: var(--text-color);
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 2rem;
        }

        .add-project-btn:hover {
            background-color: #c62828;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: var(--card-background);
            padding: 2rem;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            position: relative;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
        }

        .close-btn {
            color: #aaa;
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
        }

        .close-btn:hover,
        .close-btn:focus {
            color: var(--red-accent);
            text-decoration: none;
            cursor: pointer;
        }

        .modal-content h2 {
            color: var(--red-accent);
            margin-bottom: 1.5rem;
        }

        .modal-content label {
            display: block;
            margin-bottom: 0.5rem;
            color: #ccc;
        }

        .modal-content input,
        .modal-content textarea {
            width: calc(100% - 20px);
            padding: 10px;
            margin-bottom: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--background-color);
            color: var(--text-color);
            font-size: 1rem;
        }
        
        .modal-content textarea {
            resize: vertical;
        }

        .modal-content .submit-btn {
            background-color: var(--red-accent);
            color: var(--text-color);
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
            width: 100%;
        }

        .modal-content .submit-btn:hover {
            background-color: #c62828;
        }
    </style>
</head>
<body>

    <h1>My Projects</h1>

    <div class="project-grid" id="project-grid">
        <!-- Existing projects will be loaded here by JavaScript -->
    </div>

    <button class="add-project-btn" id="addProjectBtn">Add New Project</button>

    <!-- Modal for adding a new project -->
    <div id="addProjectModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Add New Project</h2>
            <form id="projectForm">
                <label for="projectTitle">Project Title</label>
                <input type="text" id="projectTitle" name="projectTitle" required>

                <label for="projectDescription">Description</label>
                <textarea id="projectDescription" name="projectDescription" required></textarea>

                <label for="projectLink">Project Link (URL)</label>
                <input type="url" id="projectLink" name="projectLink" required>

                <label for="projectImage">Image Link (URL)</label>
                <input type="url" id="projectImage" name="projectImage" value="https://placehold.co/400x200/1a1a1a/FFFFFF?text=New+Project">

                <button type="submit" class="submit-btn">Add Project</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const projects = [
                {
                    title: "Portfolio Website",
                    description: "A portfolio website built using React, showcasing my skills and projects.",
                    image: "https://placehold.co/400x200/1a1a1a/FFFFFF?text=Project+1",
                    link: "#"
                },
                {
                    title: "CodeDiyan",
                    description: "A community platform for developers to share code snippets.",
                    image: "https://placehold.co/400x200/1a1a1a/FFFFFF?text=Project+2",
                    link: "#"
                },
                {
                    title: "Bylg System",
                    description: "A robust task management system for small to medium-sized teams.",
                    image: "https://placehold.co/400x200/1a1a1a/FFFFFF?text=Project+3",
                    link: "#"
                },
                {
                    title: "The App",
                    description: "A mobile application designed to track personal fitness goals.",
                    image: "https://placehold.co/400x200/1a1a1a/FFFFFF?text=Project+4",
                    link: "#"
                },
                {
                    title: "My Personal Website",
                    description: "My personal website built with HTML, CSS, and Javascript. Fully responsive.",
                    image: "https://placehold.co/400x200/1a1a1a/FFFFFF?text=Project+5",
                    link: "#"
                },
                {
                    title: "Portfolio Website",
                    description: "A portfolio website built using React, showcasing my skills and projects.",
                    image: "https://placehold.co/400x200/1a1a1a/FFFFFF?text=Project+6",
                    link: "#"
                },
                {
                    title: "CodeDiyan",
                    description: "A community platform for developers to share code snippets.",
                    image: "https://placehold.co/400x200/1a1a1a/FFFFFF?text=Project+7",
                    link: "#"
                },
                {
                    title: "Bylg System",
                    description: "A robust task management system for small to medium-sized teams.",
                    image: "https://placehold.co/400x200/1a1a1a/FFFFFF?text=Project+8",
                    link: "#"
                },
                {
                    title: "The App",
                    description: "A mobile application designed to track personal fitness goals.",
                    image: "https://placehold.co/400x200/1a1a1a/FFFFFF?text=Project+9",
                    link: "#"
                },
                {
                    title: "My Personal Website",
                    description: "My personal website built with HTML, CSS, and Javascript. Fully responsive.",
                    image: "https://placehold.co/400x200/1a1a1a/FFFFFF?text=Project+10",
                    link: "#"
                }
            ];

            const projectGrid = document.getElementById('project-grid');
            const addProjectBtn = document.getElementById('addProjectBtn');
            const modal = document.getElementById('addProjectModal');
            const closeBtn = document.querySelector('.close-btn');
            const projectForm = document.getElementById('projectForm');

            function createProjectCard(project) {
                const projectCard = document.createElement('div');
                projectCard.classList.add('project-card');

                projectCard.innerHTML = `
                    <img src="${project.image}" alt="${project.title}">
                    <div class="project-info">
                        <h3>${project.title}</h3>
                        <p>${project.description}</p>
                        <a href="${project.link}" class="project-link" aria-label="View Project"><i class="fas fa-external-link-alt"></i></a>
                    </div>
                `;
                return projectCard;
            }

            function renderProjects() {
                projectGrid.innerHTML = '';
                projects.forEach(project => {
                    const card = createProjectCard(project);
                    projectGrid.appendChild(card);
                });
            }

            // Initial render of projects
            renderProjects();

            addProjectBtn.onclick = () => {
                modal.style.display = 'flex';
            };

            closeBtn.onclick = () => {
                modal.style.display = 'none';
            };

            window.onclick = (event) => {
                if (event.target == modal) {
                    modal.style.display = 'none';
                }
            };

            projectForm.addEventListener('submit', (e) => {
                e.preventDefault();

                const newProject = {
                    title: document.getElementById('projectTitle').value,
                    description: document.getElementById('projectDescription').value,
                    link: document.getElementById('projectLink').value,
                    image: document.getElementById('projectImage').value
                };

                projects.push(newProject);
                renderProjects();
                
                modal.style.display = 'none';
                projectForm.reset();
            });
        });
    </script>

</body>
</html>
